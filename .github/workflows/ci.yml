name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: taskconsole_test
          POSTGRES_USER: taskconsole
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskconsole -d taskconsole_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://taskconsole:test-only@localhost:5432/taskconsole_test
      APP_STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start from fresh volumes
        run: docker compose up --build --wait --wait-timeout 180
      - name: Prove heartbeat and idempotent workflow bootstrap
        run: deploy/compose-smoke.sh
      - name: Preserve diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-log
          path: compose.log
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
