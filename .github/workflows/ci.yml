name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: taskconsole_test
          POSTGRES_USER: taskconsole
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskconsole -d taskconsole_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://taskconsole:test-only@localhost:5432/taskconsole_test
      APP_STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=regression-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: regression-results.xml

  workflow-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: engine
            tests: >-
              tests/test_workflows_n8n.py tests/test_workflow_execution_n8n_complete.py tests/test_runtime_language_matrix.py tests/test_runtime_packs.py tests/test_runtime_projects.py tests/test_local_supervisor_integration.py
          - suite: data
            tests: >-
              tests/test_acceptance_data.py tests/test_acceptance_data_edges.py tests/test_acceptance_data_contracts.py tests/test_acceptance_data_portability.py tests/test_acceptance_json.py tests/test_acceptance_artifacts.py tests/test_acceptance_storage.py tests/test_acceptance_sql_boundaries.py tests/test_acceptance_sql_progress.py tests/test_acceptance_artifact_preview_security.py tests/test_acceptance_version_snapshots.py tests/test_acceptance_runtime_version_upgrades.py
          - suite: schedule
            tests: >-
              tests/test_acceptance_schedule_security.py tests/test_acceptance_schedule_security_closure.py tests/test_acceptance_auth_matrix.py tests/test_acceptance_schedule_anchor.py tests/test_acceptance_missed_history.py tests/test_acceptance_local_accounts_extended.py
          - suite: recovery
            tests: >-
              tests/test_acceptance_lifecycle.py tests/test_acceptance_release_edges.py tests/test_acceptance_admission_recovery.py tests/test_acceptance_local_recovery.py tests/test_acceptance_engine_recovery.py tests/test_acceptance_engine_health.py tests/test_acceptance_native_recovery_edges.py tests/test_acceptance_backup_integrity.py tests/test_acceptance_transfer_authorization.py tests/test_acceptance_delivery.py tests/test_acceptance_operations_edges.py
          - suite: execution
            tests: >-
              tests/test_acceptance_branches.py tests/test_acceptance_concurrency.py tests/test_acceptance_orchestration_faults.py tests/test_acceptance_external_uncertainty.py tests/test_acceptance_execution_limits.py tests/test_acceptance_retry_cancel.py tests/test_acceptance_cancel_settlement.py tests/test_acceptance_adapter_deadline.py tests/test_acceptance_workflow_deadline.py tests/test_acceptance_stream_redaction.py
          - suite: scale-isolation
            tests: >-
              tests/test_acceptance_gold_concurrency.py tests/test_acceptance_runtime_remaining.py tests/test_acceptance_n8n_isolation.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt pandas==2.2.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the actual orchestration engine
        run: npm install --prefix "$RUNNER_TEMP/sleep-in-n8n" --no-audit --no-fund n8n@2.39.7
      - name: Configure isolated workflow tests
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, shutil
          argv = json.dumps([shutil.which('node'), os.path.join(os.environ['RUNNER_TEMP'], 'sleep-in-n8n/node_modules/n8n/bin/n8n')])
          print('SLEEP_IN_N8N_COMMAND=' + argv)
          print('SLEEP_IN_TEST_N8N_COMMAND=' + argv)
          print('SLEEP_IN_NODE=' + shutil.which('node'))
          print('SLEEP_IN_TEST_JAVAC=' + shutil.which('javac'))
          print('SLEEP_IN_TEST_NPM=' + shutil.which('npm'))
          if shutil.which('mvn'): print('SLEEP_IN_TEST_MAVEN=' + shutil.which('mvn'))
          if shutil.which('gradle'): print('SLEEP_IN_TEST_GRADLE=' + shutil.which('gradle'))
          PY
      - name: Verify actual graphs and supervisor lifecycle
        run: python -m pytest -q ${{ matrix.tests }} -o junit_family=xunit1 -ra --junitxml=integration-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.suite }}-evidence
          path: integration-results.xml

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start from fresh volumes
        run: docker compose up --build --wait --wait-timeout 180
      - name: Prove heartbeat and idempotent workflow bootstrap
        run: deploy/compose-smoke.sh
      - name: Preserve diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-log
          path: compose.log
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  external-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - run: pip install -r requirements-dev.txt pymysql==1.2.3 oracledb==26.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install actual graph engine for cross-database language pairs
        run: npm install --prefix "$RUNNER_TEMP/sleep-in-n8n" --no-audit --no-fund n8n@2.39.7
      - name: Configure real cross-language fixtures
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, shutil
          argv = json.dumps([shutil.which('node'), os.path.join(os.environ['RUNNER_TEMP'], 'sleep-in-n8n/node_modules/n8n/bin/n8n')])
          print('SLEEP_IN_N8N_COMMAND=' + argv)
          print('SLEEP_IN_TEST_N8N_COMMAND=' + argv)
          print('SLEEP_IN_NODE=' + shutil.which('node'))
          print('SLEEP_IN_TEST_JAVAC=' + shutil.which('javac'))
          PY
      - name: Install Chromium for external-connection browser stories
        run: |
          npm install --prefix "$RUNNER_TEMP/sleep-in-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/sleep-in-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/sleep-in-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Start isolated database fixtures
        run: docker compose -f deploy/sql-matrix-compose.yaml up --wait --wait-timeout 600
      - name: Exercise real SQL transactions and typed results
        env:
          SLEEP_IN_EXTERNAL_SQL_TESTS: "1"
          SLEEP_IN_EXTERNAL_TLS_TESTS: "1"
          SLEEP_IN_BROWSER_TEST: "1"
        run: python -m pytest -q tests/test_workflow_external_sql.py tests/test_runtime_language_matrix.py::test_actual_n8n_external_directed_pairs tests/test_acceptance_external_sql_edges.py tests/test_acceptance_oracle_tls.py tests/test_acceptance_external_cancel.py tests/test_acceptance_browser_external_sql.py -o junit_family=xunit1 -ra --junitxml=external-sql-results.xml
      - name: Record versions and diagnostics
        if: always()
        run: |
          docker compose -f deploy/sql-matrix-compose.yaml images > sql-images.txt
          docker compose -f deploy/sql-matrix-compose.yaml logs --no-color > sql-services.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-matrix-diagnostics
          path: |
            sql-images.txt
            sql-services.txt
            external-sql-results.xml
      - name: Tear down isolated fixtures
        if: always()
        run: docker compose -f deploy/sql-matrix-compose.yaml down --volumes --remove-orphans

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install actual engine for browser execution stories
        run: npm install --prefix "$RUNNER_TEMP/sleep-in-n8n" --no-audit --no-fund n8n@2.39.7
      - name: Configure browser engine
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, shutil
          argv = json.dumps([shutil.which('node'), os.path.join(os.environ['RUNNER_TEMP'], 'sleep-in-n8n/node_modules/n8n/bin/n8n')])
          print('SLEEP_IN_N8N_COMMAND=' + argv)
          print('SLEEP_IN_TEST_N8N_COMMAND=' + argv)
          print('SLEEP_IN_NODE=' + shutil.which('node'))
          print('SLEEP_IN_TEST_JAVAC=' + shutil.which('javac'))
          PY
      - name: Install isolated Chromium test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/sleep-in-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/sleep-in-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/sleep-in-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Verify actual browser against a fresh local application
        env:
          SLEEP_IN_BROWSER_TEST: "1"
          SLEEP_IN_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/.browser-evidence
        run: python -m pytest -q tests/test_acceptance_browser.py tests/test_acceptance_browser_mapping.py tests/test_acceptance_browser_schedules.py tests/test_acceptance_browser_repair.py tests/test_acceptance_browser_run_feedback.py tests/test_acceptance_browser_execution.py tests/test_acceptance_browser_dataflow.py tests/test_acceptance_browser_async_admission.py tests/test_acceptance_browser_runtime.py tests/test_acceptance_browser_account_sessions.py tests/test_acceptance_browser_accessibility.py tests/test_acceptance_browser_locale.py tests/test_acceptance_browser_health.py --junitxml=browser-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            browser-results.xml
            .browser-evidence/

  mac-managed-runtime:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Acquire the actual Apple-silicon managed installation
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          managed_fixture="$RUNNER_TEMP/sleep-in-managed"
          SLEEP_IN_INSTALL_DIR="$managed_fixture" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            /bin/bash ./launch-mac.command --install-only
          "$managed_fixture/tools/uv-aarch64-apple-darwin/uv" pip install \
            --python "$managed_fixture/venv/bin/python" -r requirements-dev.txt
          echo "SLEEP_IN_TEST_INSTALL_DIR=$managed_fixture" >> "$GITHUB_ENV"
          echo "$managed_fixture/tools/node-v24.13.0-darwin-arm64/bin" >> "$GITHUB_PATH"
          SLEEP_IN_TEST_INSTALL_DIR="$managed_fixture" "$managed_fixture/venv/bin/python" - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          root = Path(os.environ['SLEEP_IN_TEST_INSTALL_DIR'])
          node = root / 'tools/node-v24.13.0-darwin-arm64/bin/node'
          command = json.dumps([str(node), str(root / 'n8n/node_modules/n8n/bin/n8n')])
          print('SLEEP_IN_N8N_COMMAND=' + command)
          print('SLEEP_IN_TEST_N8N_COMMAND=' + command)
          print('SLEEP_IN_NODE=' + str(node))
          PY
      - name: Verify managed Python packs and owned missing-component recovery
        run: |
          "$SLEEP_IN_TEST_INSTALL_DIR/venv/bin/python" -m pytest -q \
            tests/test_acceptance_runtime_repair.py tests/test_acceptance_native_controls.py -o junit_family=xunit1 -ra \
            --basetemp="$RUNNER_TEMP/managed-repair-tests" --junitxml=mac-runtime-repair.xml
      - name: Stop only this job's owned repair supervisors
        if: always()
        run: |
          managed_python="$RUNNER_TEMP/sleep-in-managed/venv/bin/python"
          if [ -x "$managed_python" ]; then
            "$managed_python" - <<'PY'
          import os, time
          from pathlib import Path
          from taskconsole.local import request_stop, status
          root = Path(os.environ['RUNNER_TEMP']) / 'managed-repair-tests'
          for state in sorted({path.resolve() for path in root.glob('*/installation/state')}):
              request_stop(state, 'cancel')
              deadline = time.monotonic() + 20
              while status(state).get('state') not in ('stopped', 'not_installed') and time.monotonic() < deadline:
                  time.sleep(.2)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-managed-runtime-evidence
          path: mac-runtime-repair.xml

  acceptance-evidence:
    if: always()
    needs: [test, workflow-integration, external-sql, browser, compose-smoke, mac-managed-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - uses: actions/download-artifact@v4
        with:
          path: .acceptance-inputs
      - name: Join exact case coverage to this revision's evidence
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          args = [sys.executable, 'tools/acceptance_report.py',
              '--cases', 'docs/testing/case-index.json',
              '--cases', 'docs/testing/traceability/data-pair-design.json']
          for family in ('data', 'data-pairs', 'schedule-security', 'ui', 'lifecycle'):
              args += ['--mapping', 'docs/testing/traceability/' + family + '.json']
          for path in sorted(pathlib.Path('.acceptance-inputs').rglob('*.xml')):
              args += ['--junit', str(path)]
          # Producing evidence is not release approval. The report retains all
          # partial, blocked, missing and failed cases; release_ready is explicit.
          args += ['--output-dir', 'acceptance-results']
          subprocess.run(args, check=True)
          PY
          git rev-parse HEAD > acceptance-results/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-by-case-acceptance
          path: acceptance-results/
