name: Release container

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and release metadata
        run: python tools/release_notes.py --check --tag "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and prepare release notes
        run: |
          python tools/release_notes.py --check --tag "$GITHUB_REF_NAME"
          python tools/release_notes.py --write release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sleep In $GITHUB_REF_NAME" --notes-file release-notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sleep In $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
