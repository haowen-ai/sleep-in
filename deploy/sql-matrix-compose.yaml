# Synthetic integration fixtures only. Bind to loopback; no persistent host volumes.
# Exact version tags are intentional; CI records resolved RepoDigests in its artifact.
services:
  postgres:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    environment:
      POSTGRES_USER: sleepin
      POSTGRES_PASSWORD: sleepin_fixture_password
      POSTGRES_DB: sleepin
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepin -d sleepin"]
      interval: 3s
      timeout: 5s
      retries: 40
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_ROOT_PASSWORD: sleepin_fixture_root
      MYSQL_USER: sleepin
      MYSQL_PASSWORD: sleepin_fixture_password
      MYSQL_DATABASE: sleepin
    ports: ["127.0.0.1:13306:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    environment:
      ORACLE_PASSWORD: sleepin_fixture_root
      APP_USER: sleepin
      APP_USER_PASSWORD: sleepin_fixture_password
    ports: ["127.0.0.1:11521:1521"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 100
      start_period: 30s
